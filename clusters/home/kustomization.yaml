apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: cluster-repo-settings
    literals:
      - repoURL=https://github.com/uttne/home-garage.git
replacements:
  - source:
      kind: ConfigMap
      name: cluster-repo-settings
      fieldPath: data.repoURL
    targets:
      - select:
          kind: Application
        fieldPaths:
          - spec.source.repoURL
