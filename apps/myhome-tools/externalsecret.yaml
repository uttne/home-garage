apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: myhome-tools-secret
  namespace: myhome
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-store
  target:
    name: myhome-tools-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "postgresql+psycopg://app:{{ .appPassword | urlquery }}@common-db-postgresql.storage.svc.cluster.local:5432/myhome_tools"
        JWT_SECRET_KEY: "{{ .jwtSecretKey }}"
  data:
    - secretKey: appPassword
      remoteRef:
        key: COMMON_DB_APP_PASSWORD
    - secretKey: jwtSecretKey
      remoteRef:
        key: MYHOME_TOOLS_JWT_SECRET_KEY
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull-secret
  namespace: myhome
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-store
  target:
    name: ghcr-pull-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "ghcr.io": {
                "username": "{{ .username }}",
                "password": "{{ .token }}",
                "auth": "{{ printf "%s:%s" .username .token | b64enc }}"
              }
            }
          }
  data:
    - secretKey: username
      remoteRef:
        key: GHCR_USERNAME
    - secretKey: token
      remoteRef:
        key: GHCR_TOKEN
