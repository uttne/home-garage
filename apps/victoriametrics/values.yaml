server:
  # ノード指定
  nodeSelector:
    node-role.kubernetes.io/monitoring: "true"
  
  # 外部公開設定
  service:
    type: LoadBalancer # TODO: セキュリティのため、将来的には ClusterIP に変更して内部だけで通信するようにする
    clusterIP: "" # Victoriametrics のデフォルトの "None" を打ち消す
  
  scrape:
    enabled: true
    config:
      global:
        scrape_interval: 15s
      scrape_configs:
        - job_name: 'node-exporter'
          kubernetes_sd_configs:
            - role: endpoints
          relabel_configs:
            - source_labels: [__meta_kubernetes_service_name]
              action: keep
              regex: .*node-exporter.*
